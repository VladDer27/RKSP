version: '3'
services:
  app1:
    container_name: app1
    image: derzhavin

  app2:
    container_name: app2
    image: derzhavin

  app3:
    container_name: app3
    image: derzhavin

  app4:
    container_name: app4
    image: derzhavin

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  db:
    image: postgres:latest
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: